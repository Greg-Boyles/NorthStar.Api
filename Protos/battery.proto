syntax = "proto3";

option csharp_namespace = "NorthStar.Api.Protos.Battery";

package services.vehiclestates.battery;

message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

message Battery {
  Timestamp timestamp = 1;
  double battery_charge_level_percentage = 2;
  double average_energy_consumption_kwh_per_100_km = 3;
  int32 estimated_distance_to_empty_km = 4;
  int32 estimated_charging_time_to_full_minutes = 5;
  int32 charger_connection_status = 6;
  int32 charging_status = 7;
  int32 estimated_distance_to_empty_miles = 8;
  int32 estimated_charging_time_minutes_to_target_distance = 9;
  int32 charging_power_watts = 10;
  int32 charging_current_amps = 11;
  double average_energy_consumption_kwh_per_100_km_automatic = 12;
  double average_energy_consumption_kwh_per_100_km_since_charge = 13;
  double total_energy_consumption_wh = 14;
  double total_energy_consumption_wh_automatic = 15;
  double total_energy_consumption_wh_since_charge = 16;
  int32 charging_type = 17;
  int32 charging_voltage_volts = 18;
  int32 estimated_charging_time_minutes_to_minimum_soc = 19;
}

message GetBatteryRequest {
  string id = 1;
  string vin = 2;
}

message GetBatteryResponse {
  string id = 1;
  string vin = 2;
  Battery battery = 3;
}

service BatteryService {
  rpc GetBattery (GetBatteryRequest) returns (stream GetBatteryResponse);
  rpc GetLatestBattery (GetBatteryRequest) returns (GetBatteryResponse);
}
