# Default values for northstar-api
# This is a YAML-formatted file with EXAMPLE values only
# DO NOT commit real credentials here - use a separate private values file

replicaCount: 1

image:
  repository: ghcr.io/greg-boyles/northstar-api
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: northstar-api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: northstar-api-tls
      hosts:
        - northstar-api.example.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Environment variables
env:
  # ASP.NET Core environment
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  
  # Redis configuration (example - replace with your actual values)
  REDIS_ENDPOINT: "redis-master.redis.svc.cluster.local:6379"

# Secrets configuration
# Option 1: Use Kubernetes External Secrets Operator
externalSecrets:
  enabled: false
  # secretStore:
  #   name: aws-secretsmanager
  #   kind: SecretStore
  # secrets:
  #   - name: polestar-credentials
  #     key: northstar/polestar-credentials

# Option 2: Reference existing Kubernetes secrets
secrets:
  # Name of existing secret containing Polestar credentials
  # Expected keys: POLESTAR_EMAIL, POLESTAR_PASSWORD
  polestarCredentials:
    secretName: "northstar-polestar-creds"
    keys:
      email: "POLESTAR_EMAIL"
      password: "POLESTAR_PASSWORD"

# Probes configuration
livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
